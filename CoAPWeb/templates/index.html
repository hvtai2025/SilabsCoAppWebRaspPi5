<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoAPWeb Smart Home Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="container">
    <div id="dashboard">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2 style="margin:0;">Smart Home Devices</h2>
        <div style="display:flex;gap:8px;align-items:center;">
          <button id="refresh-nodes-btn" class="icon-btn" title="Refresh Nodes" style="margin-left:0;" onclick="fetchNodes()">
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.13-3.36L23 10M1 14l5.37 5.37A9 9 0 0 0 21 15.49"/></svg>
          </button>
          <button id="hide-dashboard-btn" class="icon-btn" onclick="toggleDashboard()" title="Hide Dashboard" style="margin-left:0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <div id="node-loading" style="display:none;align-items:center;gap:10px;padding:16px 0;">
        <span class="spinner" style="display:inline-block;width:24px;height:24px;border:4px solid #ccc;border-top:4px solid #0078d4;border-radius:50%;animation:spin 1s linear infinite;"></span>
        <span>Getting nodes...</span>
      </div>
      <ul id="node-list" class="node-list"></ul>
      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
    <div id="user-ui" style="position:relative;">
      <div style="display:flex;align-items:center;gap:8px;">
        <h2 style="margin:0;">My Home Control</h2>
        <button id="clear-user-ui-btn" class="icon-btn" title="Clear User UI" style="margin-left:8px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </button>
      </div>
      <button id="show-dashboard-btn" class="icon-btn" style="display:none;position:absolute;top:16px;right:16px;z-index:1000;">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 8 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 5 15.4a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 8a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 8 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 16 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 8c.14.31.21.65.21 1v.09A1.65 1.65 0 0 0 21 12c0 .35-.07.69-.21 1z"/></svg>
      </button>
      <ul id="user-node-list" class="user-node-list"></ul>

      <!-- Set Name Modal Popup -->
      <div id="set-name-modal" class="modal" style="display:none;position:fixed;z-index:2000;left:0;top:0;width:100vw;height:100vh;background:rgba(0,0,0,0.25);align-items:center;justify-content:center;">
        <div class="modal-content" style="background:#fff;padding:24px 32px;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.18);min-width:320px;max-width:90vw;">
          <h3 id="set-name-title" style="margin-top:0;margin-bottom:16px;font-size:1.2em;"></h3>
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
            <img id="set-name-type-icon" src="" alt="Node Type" style="width:32px;height:32px;">
            <span id="set-name-type-label" style="font-weight:500;font-size:1.1em;"></span>
          </div>
          <input id="set-name-input" type="text" style="width:100%;padding:8px 10px;font-size:1em;margin-bottom:18px;" maxlength="32" placeholder="Enter node name">
          <div style="display:flex;justify-content:flex-end;gap:10px;">
            <button id="set-name-cancel-btn" style="padding:7px 18px;">Cancel</button>
            <button id="set-name-ok-btn" style="padding:7px 18px;background:#0078d4;color:#fff;border:none;border-radius:4px;">OK</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/script.js"></script>
  <script>
    function toggleDashboard() {
      const dashboard = document.getElementById('dashboard');
      const hideBtn = document.getElementById('hide-dashboard-btn');
      const showBtn = document.getElementById('show-dashboard-btn');
      const container = document.getElementById('container');
      if (dashboard.classList.contains('slide-out')) {
        dashboard.classList.remove('slide-out');
        dashboard.classList.add('slide-in');
        setTimeout(() => {
          hideBtn.style.display = '';
          showBtn.style.display = 'none';
          container.classList.remove('full-user-ui');
        }, 400);
      } else {
        dashboard.classList.remove('slide-in');
        dashboard.classList.add('slide-out');
        hideBtn.style.display = 'none';
        setTimeout(() => {
          showBtn.style.display = '';
          container.classList.add('full-user-ui');
        }, 400);
      }
    }
    // Initial state
    document.getElementById('dashboard').classList.add('slide-in');
    document.getElementById('show-dashboard-btn').onclick = toggleDashboard;
  </script>
</body>
</html>
